name: Build plugins and publish repository

# Incremental by default: only plugins whose sources changed in the push are rebuilt; every other
# JAR is carried over byte-identical from the current repo branch (no hash churn). A FULL
# rebuild happens when anything outside src/ changes (build infrastructure), when the repo
# branch doesn't exist yet, when the pre-push commit is unknown (force push), or on manual dispatch.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time — concurrent force-pushes to the repo branch would race.
concurrency:
  group: publish-plugins
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      changed: ${{ steps.scope.outputs.changed }}
      plugins: ${{ steps.publish.outputs.plugins }}
      changes: ${{ steps.summary.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # change detection diffs against the pre-push commit

      - name: Determine build scope
        id: scope
        run: |
          FULL=1
          CHANGED=""
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] \
             && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git ls-remote --exit-code origin repo >/dev/null 2>&1; then
            DIFF="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
            # Any change outside src/ (build files, workflow, tools/) forces a full rebuild.
            if ! echo "$DIFF" | grep -qvE '^src/'; then
              FULL=0
              # src/<kind>/<dir>/** → <kind>-<dir>, keeping only modules that still exist
              # (a deleted plugin is pruned by updatePluginsRepo without being rebuilt).
              for m in $(echo "$DIFF" | sed -nE 's#^src/(content|metadata)/([^/]+)/.*#\1/\2#p' | sort -u); do
                if [ -d "src/$m" ]; then
                  CHANGED="$CHANGED,$(echo "$m" | tr '/' '-')"
                fi
              done
              CHANGED="${CHANGED#,}"
            fi
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Build scope: full=$FULL changed=[$CHANGED]"

      # Gradle runs on JDK 21; the Java 25 toolchain the plugins target is auto-downloaded by the
      # foojay resolver plugin (see settings.gradle.kts).
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin repository (full)
        if: steps.scope.outputs.full == '1'
        run: ./gradlew generatePluginsJson

      # Two uses: the JARs an incremental build carries over, and the baseline the change summary
      # below diffs against — which is why it runs for full rebuilds too. Absent on the very first
      # publish, when the repo branch doesn't exist yet.
      - name: Fetch the current plugin repository
        run: |
          if git ls-remote --exit-code origin repo >/dev/null 2>&1; then
            git fetch origin repo
            mkdir -p prev-repo
            git archive origin/repo | tar -x -C prev-repo
          else
            echo "No repo branch yet — first publish, nothing to diff against."
          fi

      - name: Build plugin repository (incremental)
        if: steps.scope.outputs.full == '0'
        run: ./gradlew updatePluginsRepo -PpreviousRepo="$PWD/prev-repo" -PchangedPlugins="${{ steps.scope.outputs.changed }}"

      - name: Push plugin repository to the repo branch
        id: publish
        run: |
          cd build/plugins-repo
          echo "plugins=$(jq 'length' plugins.json)" >> "$GITHUB_OUTPUT"
          git init -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build plugins from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Which plugins the publish actually *changed*, from the JAR digests in plugins.json rather than
      # from the rebuild list: a rebuilt module whose JAR came out byte-identical is not news, and a
      # changed JAR that kept its version is worth shouting about — PF4J only reloads a plugin when its
      # version moves, so that build ships nothing to installed servers.
      # Runs after the push (a summary bug must never block a publish) and can't fail the job.
      - name: Summarize published plugins
        id: summary
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY' > plugin-changes.txt
          import json, pathlib

          def load(path):
              p = pathlib.Path(path)
              return json.loads(p.read_text(encoding="utf-8")) if p.is_file() else []

          # One release per entry — the build writes exactly the JAR it just produced.
          def release(entry):
              return (entry.get("releases") or [{}])[0]

          def label(entry):
              return f'{(entry.get("kind") or "other").lower()}/{entry.get("id")}'

          # Missing on the first publish: everything then reads as new, which is the truth.
          prev = {e.get("id"): e for e in load("prev-repo/plugins.json")}
          new = load("build/plugins-repo/plugins.json")

          lines = []
          for e in new:
              r = release(e)
              old = prev.get(e.get("id"))
              if old is None:
                  lines.append(f'{label(e)} {r.get("version")} — new')
                  continue
              o = release(old)
              if o.get("sha512sum") == r.get("sha512sum"):
                  continue  # carried over byte-identical — not news
              if o.get("version") != r.get("version"):
                  lines.append(f'{label(e)} {o.get("version")} → {r.get("version")}')
              else:
                  lines.append(f'{label(e)} {r.get("version")} — rebuilt, version unchanged')

          ids = {e.get("id") for e in new}
          lines += [f'{label(o)} — removed' for i, o in prev.items() if i not in ids]
          print("\n".join(lines))
          PY
          cat plugin-changes.txt
          # Multi-line step output. The delimiter is ours, not plugin-derived, so it can't be spoofed
          # by a manifest value that happens to contain it.
          {
            echo "changes<<PLUGIN_CHANGES_EOF"
            cat plugin-changes.txt
            echo "PLUGIN_CHANGES_EOF"
          } >> "$GITHUB_OUTPUT"


  # Pings a Telegram chat once the publish finishes. Needs two repository secrets —
  # TELEGRAM_TOKEN (from @BotFather) and TELEGRAM_CHAT_ID; without them the job logs a notice and
  # exits cleanly, so forks and clones still publish without any setup. Secret names match the
  # kodex-client repo; the message shape follows the kodex repo's notifier.
  notify:
    name: Notify Telegram
    needs: build
    runs-on: ubuntu-latest
    # always() so failures are reported too — that's the notification actually worth having. Cancelled
    # runs are skipped: the concurrency group cancels superseded pushes routinely, which would be pure noise.
    if: ${{ always() && needs.build.result != 'cancelled' }}
    steps:
      - name: Send Telegram message
        # A broken notifier must not turn a good publish red; the step still shows as failed in the run.
        continue-on-error: true
        env:
          # Everything the message interpolates arrives through env, never as ${{ }} inside the script:
          # a commit subject is attacker-controlled text, and expanding it into the shell source would
          # be a script-injection hole.
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.build.result }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          FULL: ${{ needs.build.outputs.full }}
          CHANGED: ${{ needs.build.outputs.changed }}
          CHANGES: ${{ needs.build.outputs.changes }}
          PLUGINS: ${{ needs.build.outputs.plugins }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}/tree/repo
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "::notice::TELEGRAM_TOKEN / TELEGRAM_CHAT_ID not set — skipping notification."
            exit 0
          fi

          # parse_mode=HTML needs exactly these three escaped (MarkdownV2 would need eighteen).
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          subject=${COMMIT_MSG%%$'\n'*}   # first line only; no pipe, so a huge body can't trip pipefail
          short_sha=${SHA:0:7}

          {
            if [ "${RESULT}" = "success" ]; then
              printf '✅ <b>%s</b> — plugin repository published\n' "$(esc "${REPO}")"
            else
              printf '❌ <b>%s</b> — plugin publish failed\n' "$(esc "${REPO}")"
            fi
            printf '<b>Ref:</b> %s · <code>%s</code>\n' "$(esc "${REF_NAME}")" "$(esc "${short_sha}")"
            if [ -n "${subject}" ]; then
              printf '<b>Commit:</b> %s\n' "$(esc "${subject}")"
            fi
            printf '<b>By:</b> %s\n' "$(esc "${ACTOR}")"
            if [ "${FULL}" = "1" ]; then
              printf '<b>Scope:</b> full rebuild\n'
            elif [ -n "${CHANGED}" ]; then
              printf '<b>Scope:</b> incremental — %s\n' "$(esc "$(printf '%s' "${CHANGED}" | tr ',' ' ')")"
            else
              printf '<b>Scope:</b> incremental — no plugin sources changed\n'
            fi
            # The plugins whose published JAR actually moved, named one per line with their versions.
            if [ "${RESULT}" = "success" ]; then
              total=$(printf '%s\n' "${CHANGES}" | grep -c . || true)
              if [ "${total}" -gt 0 ]; then
                printf '<b>Plugins changed (%s):</b>\n' "$(esc "${total}")"
                # sed, not head: head closes the pipe early, which trips pipefail.
                printf '%s\n' "${CHANGES}" | sed -n '1,20p' | while IFS= read -r line; do
                  if [ -n "${line}" ]; then printf '• <code>%s</code>\n' "$(esc "${line}")"; fi
                done
                if [ "${total}" -gt 20 ]; then printf '… and %s more\n' "$((total - 20))"; fi
              else
                printf '<b>Plugins changed:</b> none — every JAR is byte-identical\n'
              fi
              if [ -n "${PLUGINS}" ]; then
                printf '<b>Repository:</b> <a href="%s">%s plugin(s) on the repo branch</a>\n' \
                  "$(esc "${REPO_URL}")" "$(esc "${PLUGINS}")"
              fi
            fi
            printf '<a href="%s">View run</a>\n' "$(esc "${RUN_URL}")"
          } > telegram-message.html

          # text@file keeps the body out of the process arguments (and out of `ps`), and lets curl
          # URL-encode the newlines/markup for us.
          status=$(curl --silent --show-error \
            --request POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@telegram-message.html" \
            --output telegram-response.json --write-out '%{http_code}') || status=000

          # Report the API's own reason rather than a bare exit code — a rejected parse_mode or a wrong
          # chat id is otherwise invisible. (Both secrets are masked by the runner in this output.)
          if [ "${status}" != "200" ]; then
            echo "::error::Telegram sendMessage failed (HTTP ${status})"
            cat telegram-response.json || true
            exit 1
          fi
          echo "Telegram notification sent."
